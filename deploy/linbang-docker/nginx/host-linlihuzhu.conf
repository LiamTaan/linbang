server {
    listen 80;
    server_name llhz.yunying2026.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name llhz.yunying2026.top;

    ssl_certificate /www/server/panel/vhost/cert/llhz.yunying2026.top/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/llhz.yunying2026.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:8013;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_read_timeout 600s;
    }

    access_log /www/wwwlogs/linbang/access.log;
    error_log /www/wwwlogs/linbang/error.log;
}
